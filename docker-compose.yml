services:
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No ports published — only reachable by services in this compose network (db:5432).
    # To run psql manually: docker compose exec -T db psql -U postgres -d postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    labels:
      # autoheal restarts this container when /health goes unhealthy (e.g. the
      # Telegram polling supervisor died and nothing is recovering it).
      - autoheal=true
    depends_on:
      db:
        condition: service_healthy
    # python:3.11-slim has no curl/wget — probe /health with stdlib urllib.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  bot:
    build: .
    command: python main.py
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    # Was "no": a crashed standalone bot stayed down silently.
    restart: unless-stopped
    profiles:
      - bot

  # Watches container health and restarts unhealthy containers. Without this,
  # Docker marks a hung backend "unhealthy" but never restarts it — the bot
  # looks alive from the outside while jobs silently stop reaching Telegram.
  autoheal:
    image: willfarrell/autoheal:latest
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_START_PERIOD: "60"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "30"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Photon Spectrum sidecar for DELIVERY_CHANNEL=imessage. Holds the
  # spectrum-ts persistent connection (iMessage send/receive) and exposes a
  # loopback HTTP API to the backend. Opt-in: run with
  #   docker compose --profile imessage up -d
  imessage-sidecar:
    build: ./sidecar
    environment:
      SPECTRUM_PROJECT_ID: ${SPECTRUM_PROJECT_ID:?set SPECTRUM_PROJECT_ID in .env}
      SPECTRUM_PROJECT_SECRET: ${SPECTRUM_PROJECT_SECRET:?set SPECTRUM_PROJECT_SECRET in .env}
      INBOUND_FORWARD_URL: http://backend:8000/imessage/inbound
      PORT: "8789"
    # No ports published — only reachable inside the compose network.
    profiles:
      - imessage
    restart: unless-stopped

volumes:
  pgdata:
