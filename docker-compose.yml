services:
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # localhost-only: lets psql/GUI tools and the app (run outside compose) reach it.
      # Host port 15432 (kept well clear of 5432/5433/5444); the container still listens
      # on 5432 internally, so the app connects to db:5432 over the compose network.
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build: .
    command: python main.py
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    profiles:
      - bot

volumes:
  pgdata:
