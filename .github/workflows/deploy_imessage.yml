name: Deploy iMessage

on:
  push:
    branches: [imessage]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-imessage
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/imessage'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy isolated iMessage stack via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMESSAGE_PROJECT_PATH: ${{ secrets.IMESSAGE_PROJECT_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          envs: IMESSAGE_PROJECT_PATH
          script: |
            set -euo pipefail
            cd "${IMESSAGE_PROJECT_PATH:?set the separate iMessage checkout path}"
            test "$(git branch --show-current)" = imessage
            git pull --ff-only origin imessage
            bash scripts/deploy_imessage.sh "$PWD"
